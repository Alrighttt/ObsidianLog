name: Bug report
description: Report something that isn't working as expected.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please **do not** report
        security vulnerabilities here — see [SECURITY.md](../security/policy).
  - type: dropdown
    id: crate
    attributes:
      label: Which part is affected?
      options:
        - "obsidianlog-store (storage pipeline)"
        - "obsidianlog-ingest (HTTP ingest service)"
        - "obsidianlog (CLI / binary)"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, plus what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, and config to reproduce.
      placeholder: |
        1. Run `obsidianlog ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version & environment
      description: Output of `obsidianlog --version`, your OS, and `rustc --version`.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste any error output. This will be rendered as code.
      render: shell
    validations:
      required: false
