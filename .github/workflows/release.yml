name: Release

# Cross-platform binary release pipeline. Built ahead of need (per the
# "cross-platform static binary shipping" risk mitigation) so it is ready well
# before the Month 2/3 distribution milestones.
#
# Triggers on a pushed semver tag (e.g. `v0.1.0`). Builds the `obsidianlog`
# binary for each target, packages it, and attaches it to the GitHub Release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  upload:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and upload binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: obsidianlog
          target: ${{ matrix.target }}
          # Statically linked where the target allows; cross-compiles via `cross`.
          archive: obsidianlog-$tag-$target
          token: ${{ secrets.GITHUB_TOKEN }}
